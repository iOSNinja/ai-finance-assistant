[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-finance-assistant"
version = "0.1.0"
description = "Multi-agent personal finance assistant build with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "openai>=1.3.0",
    "langgraph>=1.2.2",
    "langchain>=1.3.2",
    "langchain-openai>=1.2.2",
    "langchain-community>=0.4.2",
    "chromadb>=1.5.9",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.57.0",
    "yfinance>=1.4.0",
    "tavily-python>=0.7.24",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",
    "tiktoken>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
