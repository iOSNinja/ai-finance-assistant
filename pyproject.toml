[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-finance-assistant"
version = "0.1.0"
description = "Multi-agent personal finance assistant build with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "openai>=1.3.0",
    "langgraph>=1.2.2",
    "langchain>=1.3.2",
    "langchain-openai>=1.2.2",
    "langchain-community>=0.4.2",
    "chromadb>=1.5.9",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.57.0",
    "yfinance>=1.4.0",
    "tavily-python>=0.7.24",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",
    "tiktoken>=0.7.0",
    "python-json-logger>=4.1.0",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "mcsp[cli]>=1.2.2",
    "mcp[cli]>=1.27.2",
    "uvicorn>=0.48.0",
    "starlette>=1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

# Ruff config - configure global options
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "chroma_db", "logs"] #ignore these

[tool.ruff.lint]
# Enable selected rule sets (see https://docs.astral.sh/ruff/rules/)
# Setting up code analysis and error-checking rules.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (real bugs)
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modernization)
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",   # line too long — we use the formatter for length
]

[tool.ruff.lint.per-file-ignores]
# Overriding Linter Rules Per-File
"scripts/**" = ["E402", "F401"]
"tests/eval/**" = ["E402"]

[tool.ruff.format]
# configuration block for code rewriting stylization.
quote-style = "double"
indent-style = "space"

# Pytest config - Pytest Test Discovery
[tool.pytest.ini_options]
testpaths = ["tests/unit"]                # only auto-discover unit tests
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# command line flags that will automatically run every single time you type pytest in the terminal
addopts = [
    "-v",                                  # verbose
    "--strict-markers",                    # typo in @pytest.mark.X fails loudly
    "--tb=short",                          # short tracebacks
]
markers = [
    "slow: tests that take more than 1 second",
    "integration: tests hitting real external services",
    "eval: end-to-end eval suite — only run on main/scheduled",
]