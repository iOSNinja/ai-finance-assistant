# Finnie configuration
app:
  name: "AI Finance Assistant"
  version: "0.0.1"

llm:
  model: "gpt-4o"
  embedding_model: "text-embedding-3-small"

rag:
  collection_name: "finnie_kb"
  persist_dir: "./chroma_db"
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 5

market:
  cache_ttl_quote_seconds: 1800 # 30 min for quotes
  cache_ttl_history_seconds: 3600 # 60 min for historicals

new:
  cache_ttl_seconds: 3600 # 1 hr
  max_results: 5

langsmith:
  project: "finnie-ai-finance-assistant"
  enabled: true